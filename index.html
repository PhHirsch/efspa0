<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Los Juegos del Ciervo · Español EF</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#07080d;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .D{font-family:Anton,Impact,"Arial Narrow Bold",sans-serif;letter-spacing:.04em;font-weight:400}
  /* Hintergrund (passt sich dem Spiel an) */
  .bg{position:fixed;inset:0;z-index:0;transition:opacity .7s}
  .bgart{position:fixed;right:-40px;top:40px;width:640px;opacity:.28;z-index:0;transition:opacity .5s;pointer-events:none;filter:saturate(1.2)}
  .bgart svg{width:100%;height:auto}
  .rays{position:fixed;left:-300px;top:-300px;width:1100px;height:1300px;z-index:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,255,255,.04) 0 6deg,transparent 6deg 18deg);animation:spin 80s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:16px 24px 100px}
  /* Kopfzeile */
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hex{width:52px;height:58px;background:linear-gradient(180deg,#ffd23a,#f08a1a);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-size:26px;color:#2a1600;flex:none}
  .tier{min-width:220px}.tier .D{font-size:19px}
  .bar{height:11px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin-top:4px;transform:skewX(-20deg);width:280px;max-width:60vw}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#4fe3ff,#b46bff)}
  .xpt{font-size:12px;color:#b9c3d6;margin-top:3px}
  .pills{margin-left:auto;display:flex;gap:10px;align-items:center}
  .pill{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);padding:7px 15px;border-radius:30px;font-size:21px;backdrop-filter:blur(8px)}
  .logo{font-size:26px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand img{width:52px;height:52px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .brand .bn{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:21px;color:#e9bd4a;letter-spacing:.08em;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  .brand .bn small{display:block;font-family:Inter,sans-serif;font-weight:700;font-size:11px;letter-spacing:.22em;color:#b9c3d6;margin-top:4px}
  .brand.big img{width:72px;height:72px}.brand.big .bn{font-size:30px}
  @media(max-width:760px){.brand:not(.big) .bn{display:none}.brand img{width:44px;height:44px}}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand img{width:52px;height:52px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .brand .bn{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:21px;color:#e9bd4a;letter-spacing:.08em;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  .brand .bn small{display:block;font-family:Inter,sans-serif;font-weight:700;font-size:11px;letter-spacing:.22em;color:#b9c3d6;margin-top:4px}
  .brand.big img{width:72px;height:72px}.brand.big .bn{font-size:30px}
  @media(max-width:760px){.brand:not(.big) .bn{display:none}.brand img{width:44px;height:44px}}
  .out{background:none;border:1px solid rgba(255,255,255,.25);color:#cfd6e4;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
  /* Lobby */
  .lobby{display:grid;grid-template-columns:380px 1fr;gap:30px;margin-top:18px;align-items:start}
  @media(max-width:900px){.lobby{grid-template-columns:1fr}.hero{max-width:340px;margin:0 auto}}
  .hero{text-align:center}
  .ava{width:320px;height:320px;max-width:80vw;max-height:80vw;border-radius:50%;overflow:hidden;margin:0 auto;box-shadow:0 0 0 6px rgba(255,255,255,.14),0 0 80px var(--glow,rgba(120,90,255,.75));transition:box-shadow .7s}
  .podium{width:360px;max-width:90vw;height:46px;margin:-18px auto 0;background:radial-gradient(ellipse at 50% 30%,rgba(140,120,255,.8) 0%,rgba(60,40,140,.6) 45%,transparent 70%)}
  .pname{font-size:42px;font-style:italic;margin-top:-4px;text-shadow:0 4px 0 rgba(0,0,0,.4)}
  .psub{color:#c9c2ff;font-weight:800;letter-spacing:.2em;font-size:12px}
  .badges{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .badges span{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:19px}
  .badges span.off{opacity:.25;filter:grayscale(1)}
  .login{background:rgba(10,12,24,.65);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:16px;margin-top:14px;backdrop-filter:blur(10px);text-align:left}
  .login input{font-size:22px;padding:9px 10px;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;width:110px;text-align:center}
  .login label{font-size:12px;color:#b9c3d6;display:block;margin-bottom:3px;font-weight:700;letter-spacing:.1em}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .msg{min-height:20px;margin-top:6px;font-weight:700;color:#ff8a8a;font-size:14px}.msg.ok{color:#7dffb0}
  .de{font-size:13px;color:#b9c3d6;font-style:italic}
  /* Featured */
  .feat{position:relative;min-height:300px;padding-top:30px}
  .feat .kicker{letter-spacing:.25em;font-weight:800;font-size:12px;color:#ffd23a}
  .feat h1{font-size:64px;line-height:1;margin:8px 0 10px;font-style:italic;text-shadow:0 6px 30px rgba(0,0,0,.5)}
  .feat p{color:#dfe6f2;font-size:17px;line-height:1.5;max-width:520px}
  .meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:6px;color:#dfe6f2;font-weight:700}
  .meta .st{color:#ffd23a;font-size:20px;letter-spacing:2px}
  .play{display:inline-flex;align-items:center;gap:10px;background:#ffd23a;color:#2a1600;font-size:30px;padding:10px 38px;border-radius:6px;transform:skewX(-8deg);box-shadow:0 7px 0 #b8860b,0 14px 40px rgba(255,200,40,.3);text-decoration:none;margin-top:18px}
  .play span{transform:skewX(8deg);display:inline-block}
  .play:active{transform:skewX(-8deg) translateY(4px);box-shadow:0 3px 0 #b8860b}
  .top3{display:flex;gap:10px;align-items:center;margin-top:18px;font-size:13px;font-weight:700}
  .top3 .p{display:flex;flex-direction:column;align-items:center;gap:3px}
  .top3 .p div{width:44px;height:44px;border-radius:50%;overflow:hidden;border:3px solid #fff3}
  .top3 .p.g div{border-color:#ffd23a}.top3 .p.s div{border-color:#c9d2e3}.top3 .p.b div{border-color:#d08a4a}
  /* Reihen */
  .shelf{margin-top:30px}
  .shelf h3{margin:0 0 10px;font-size:22px;font-style:italic}
  .shelf h3 small{font-family:Inter,sans-serif;font-style:normal;font-size:13px;color:#b9c3d6;letter-spacing:.05em;margin-left:8px}
  .strip{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .strip::-webkit-scrollbar{height:6px}.strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
  .card{width:240px;height:150px;flex:none;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;scroll-snap-align:start;box-shadow:0 10px 30px rgba(0,0,0,.45);border:2px solid transparent;transition:transform .15s,border-color .15s}
  .card.sel{border-color:#ffd23a;transform:translateY(-4px)}
  .card .art{position:absolute;inset:0 0 34px 0;display:grid;place-items:center}
  .card .art svg{height:100%;max-width:100%}
  .card .lab{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.2));font-weight:800;font-size:15px}
  .card .lab small{display:block;font-size:11px;color:#ffd23a;letter-spacing:.08em}
  .card .prog{position:absolute;left:0;bottom:0;height:4px;background:#ffd23a}
  .card .new{position:absolute;top:8px;left:8px;background:#ff2a8a;font-size:11px;font-weight:800;letter-spacing:.1em;padding:2px 8px;border-radius:4px}
  /* Navigation */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;height:64px;background:rgba(5,6,12,.75);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:center;gap:clamp(18px,6vw,60px);align-items:center}
  .nav button{background:none;border:none;color:#cfd6e4;font-size:20px;cursor:pointer;padding:6px 4px;border-bottom:3px solid transparent}
  @media(max-width:480px){.nav button{font-size:16px;padding:6px 2px}.nav{gap:14px!important}}
  @media(max-width:480px){.nav button{font-size:16px;padding:6px 2px}.nav{gap:14px!important}}
  .nav button.on{color:#ffd23a;border-bottom-color:#ffd23a}
  /* Overlays */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;z-index:10;overflow:auto;padding:16px 16px 90px}
  .ov.show{display:block}
  .sheet{max-width:980px;margin:0 auto;background:#151a2a;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px}
  .btn{font-size:17px;padding:10px 18px;border-radius:12px;border:2px solid #4a5a80;background:#2a3350;color:#fff;cursor:pointer;font-weight:700}
  .btn.primary{background:#ffd23a;border-color:#ffd23a;color:#2a1600}
  .btn.small{font-size:14px;padding:6px 12px}
  .btn:disabled{opacity:.45}
  .shoptop{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .preview{width:180px;border-radius:16px;overflow:hidden;flex:none}
  .coins{font-size:26px;color:#ffd23a}
  .lvl{display:inline-block;background:#5a3cb0;border-radius:20px;padding:3px 12px;font-weight:800;font-size:14px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
  .tab{font-size:15px;padding:7px 12px;border-radius:20px;border:2px solid #4a5a80;background:transparent;color:#fff;cursor:pointer;font-weight:700}
  .tab.on{background:#ffd23a;border-color:#ffd23a;color:#2a2200}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .item{background:#0f1322;border:3px solid transparent;border-radius:12px;padding:6px;cursor:pointer;text-align:center;font-size:14px;color:#fff;position:relative}
  .item .mini{border-radius:8px;overflow:hidden}
  .item.sel{border-color:#ffd23a}.item.wear{box-shadow:0 0 0 2px #7dffb0 inset}
  .item .lock{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.75);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700}
  .price{font-weight:800;color:#ffd23a}.price.own{color:#7dffb0}
  .iname{font-weight:700;margin-top:4px;line-height:1.2}
  .rar{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:2px 0}
  h3.sec{font-size:16px;color:#c9d2e3;margin:14px 0 8px;font-family:Inter,sans-serif}
  .trow{display:flex;align-items:center;gap:12px;background:#0f1322;border-radius:12px;padding:10px 12px;margin:8px 0}
  .trow .nm{flex:1;font-weight:700}
  .ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .ach div{background:#0f1322;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
  .ach div.off{opacity:.35;filter:grayscale(1)}
  .ach b{font-size:26px}
  .howto{background:#ffd23a;color:#2a1600;border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;letter-spacing:.05em;cursor:pointer}
  .pinlink{background:none;border:0;color:#b9c3d6;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:6px}
  .pinbox{max-width:440px;margin:12vh auto 0;text-align:center}
  .pinbox input{font-size:30px;letter-spacing:.3em;padding:10px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;width:150px;text-align:center;margin:6px}
  .pinbox label{display:block;font-size:13px;color:#b9c3d6;font-weight:700;letter-spacing:.08em;margin-top:10px}
  /* Tutorial */
  .tour{position:fixed;inset:0;z-index:50;display:none}
  .tour.show{display:block}
  .tour .hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.78),0 0 0 4px #ffd23a,0 0 30px #ffd23a;transition:all .35s;pointer-events:none}
  .tour .tip{position:fixed;width:min(380px,92vw);background:#151a2a;border:2px solid #ffd23a;border-radius:16px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:top .35s,left .35s}
  .tour .tip h4{margin:0 0 6px;font-size:24px}
  .tour .tip p{margin:0 0 6px;font-size:16px;line-height:1.45}
  .tour .tip .de{display:block;margin-bottom:10px}
  .tour .steps{font-size:12px;color:#b9c3d6;font-weight:700;letter-spacing:.1em}
  .help{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;font-weight:800;cursor:pointer}
  .pill.fire{color:#ffb03a}.pill.fire.cold{color:#9aa;filter:grayscale(.6)}
  .pill.fire small{font-size:12px;margin-left:4px;font-family:system-ui;color:#ffd0a0}
  .crowns{display:inline-block;margin-top:6px;background:linear-gradient(135deg,#ffd23a,#ff9a2a);color:#3a2000;font-weight:800;font-size:14px;padding:3px 12px;border-radius:20px}
  .ava.maestro{box-shadow:0 0 0 4px #ffd23a,0 0 30px #ffd23a88;border-radius:50%}
  .card .crown{position:absolute;top:6px;right:8px;font-size:24px;filter:drop-shadow(0 2px 3px #0008)}
  .mc{margin:6px 0 18px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1b2a4a,#3a2160);border:1px solid rgba(255,255,255,.15);display:flex;flex-wrap:wrap;align-items:stretch}
  .mc .pz{flex:1 1 380px;min-height:150px;background:#7ec8ff}
  .mc .pz svg{display:block;width:100%;height:100%}
  .mc .tx{flex:1 1 300px;padding:14px 18px}
  .mc h3{margin:0 0 4px;font-size:24px}
  .mc .mb{height:16px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;margin:8px 0}
  .mc .mb i{display:block;height:100%;background:linear-gradient(90deg,#ffd23a,#ff6a2a)}
  .mc .ms{display:flex;flex-wrap:wrap;gap:5px;font-size:12px}
  .mc .ms span{background:rgba(255,255,255,.12);padding:2px 8px;border-radius:10px}
  .mc .ms span.ok{background:#3fd27a;color:#032}
  .mine{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;margin:8px 0 14px;align-items:stretch}
  .mine:empty{display:none}
  @media(max-width:900px){.mine{grid-template-columns:1fr}#mine2{margin-top:18px}}
  .tile{border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,#1b2a4a,#2a2160);border:1px solid rgba(255,255,255,.15);position:relative;overflow:hidden}
  .tile h3{margin:0 0 6px;font-size:20px;letter-spacing:.04em}
  .tile .de{font-size:13px;opacity:.85}
  .cont{display:flex;align-items:center;gap:14px;text-decoration:none;color:#2a1600;background:linear-gradient(135deg,#ffd23a,#ff9a2a);border:0;box-shadow:0 7px 0 #b8640b;cursor:pointer;transition:transform .1s}
  .cont:active{transform:translateY(4px);box-shadow:0 3px 0 #b8640b}
  .cont .ic{font-size:54px;line-height:1;flex:none;animation:cbob 1.8s ease-in-out infinite}
  @keyframes cbob{50%{transform:translateY(-5px) rotate(-4deg)}}
  .cont .k{font-size:13px;font-weight:900;letter-spacing:.18em}
  .cont .n{font-size:26px;font-weight:900;line-height:1.1;font-style:italic}
  .cont .sub{font-size:14px;font-weight:700;opacity:.8}
  .cont .pb{height:8px;border-radius:5px;background:rgba(0,0,0,.2);margin-top:6px;overflow:hidden;max-width:260px}
  .cont .pb i{display:block;height:100%;background:#2a1600}
  .reto{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:15px}
  .reto .ck{width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;flex:none;font-size:14px}
  .reto.ok .ck{background:#3fd27a;border-color:#3fd27a;color:#032}
  .reto.ok .tx{opacity:.7;text-decoration:line-through}
  .reto .nn{margin-left:auto;font-weight:800;font-size:13px;opacity:.8}
  .rbar{height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0}
  .rbar i{display:block;height:100%;background:linear-gradient(90deg,#3fd27a,#b8ff5a)}
  .goal{display:flex;gap:12px;align-items:center}
  .goal .gv{width:86px;height:86px;border-radius:14px;overflow:hidden;flex:none;border:3px solid #ffd23a}
  .goal .gb{height:12px;border-radius:7px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0}
  .goal .gb i{display:block;height:100%;background:linear-gradient(90deg,#ffd23a,#ff6a2a)}
  .goal.ready .gv{animation:gglow 1.2s ease-in-out infinite}
  @keyframes gglow{50%{box-shadow:0 0 22px #ffd23a}}
  .tbtn2{display:inline-block;margin-top:6px;background:#ffd23a;color:#2a1600;font-weight:900;border:0;border-radius:10px;padding:7px 14px;font-size:15px;cursor:pointer}
  .titulo{display:inline-block;margin-top:4px;background:linear-gradient(135deg,#6a3cff,#ff3bd4);color:#fff;font-weight:900;font-size:14px;letter-spacing:.06em;padding:4px 14px;border-radius:6px;transform:skewX(-8deg);cursor:pointer;border:0;box-shadow:0 4px 0 #3a1a80}
  .titulo span{display:inline-block;transform:skewX(8deg)}
  .tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .tlist button{text-align:left;background:#0f1322;border:2px solid #2a3350;border-radius:12px;padding:10px;color:#fff;cursor:pointer;font:inherit}
  .tlist button b{display:block;font-size:16px}
  .tlist button small{opacity:.7}
  .tlist button.on{border-color:#ffd23a;background:#2a2410}
  .tlist button:disabled{opacity:.35;filter:grayscale(1);cursor:default}
  .dorsal{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .dorsal input{width:70px;font-size:20px;font-weight:900;text-align:center;padding:6px;border-radius:10px;border:2px solid #ffd23a;background:#0f1322;color:#fff}
  .item .goalmark{position:absolute;left:6px;top:6px;font-size:18px}
  .mbadge{position:absolute;right:8px;top:8px;background:#3fae5a;color:#fff;font-weight:900;font-size:12px;padding:2px 8px;border-radius:10px;z-index:2}
  .vt{display:flex;gap:8px;justify-content:center;margin:0 0 12px}
  .vt button{font-size:16px;padding:8px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;cursor:pointer;font-weight:700}
  .vt button.on{background:#fff;color:#111}
  .map{border-radius:18px;overflow:hidden;background:#1a3a5a;border:1px solid rgba(255,255,255,.15);margin-bottom:24px}
  .map svg{display:block;width:100%;height:auto}
  .map .nd{cursor:pointer}
  .map .nd:hover circle.o{stroke:#fff}
  .card .hard{position:absolute;top:6px;right:34px;font-size:20px;filter:drop-shadow(0 2px 3px #0008)}
  .albumlink{display:inline-block;margin-top:6px;margin-left:6px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:700;font-size:14px;padding:3px 12px;border-radius:20px;text-decoration:none}
  .hardbtn{display:inline-block;margin-left:10px;padding:10px 16px;border-radius:12px;background:#ff3a2a;color:#fff;font-weight:800;text-decoration:none;font-size:16px;vertical-align:middle}
</style>
</head>
<body>
<div class="bg" id="bgA"></div><div class="bg" id="bgB" style="opacity:0"></div>
<div class="rays"></div>
<div class="bgart" id="bgart"></div>
<div class="wrap">
  <div class="top" id="top"></div>
  <div class="mine" id="mine"></div>
  <div class="lobby">
    <div class="hero" id="hero"></div>

/* ===== Mi panel: Continuar · Retos de la semana · Mi objetivo ===== */
function localSaves(nr){
  const out = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i);
    if (!k || k.indexOf("efspa0-") !== 0 || !k.endsWith("@" + nr)) continue;
    const x = JSON.parse(localStorage.getItem(k));
    if (x && !x.done && x.m && x.saved && Date.now() - x.saved < 21*864e5) out[k.slice(0, -(nr.length + 1))] = Object.assign({t:x.saved}, x.m);
  } } catch(e) {}
  return out;
}
function contTarget(){
  const s = state(); if (!s) return null;
  const sv = Object.assign({}, localSaves(s.nr));
  Object.entries(s.saves||{}).forEach(([k,v]) => { if (!sv[k] || sv[k].t < v.t) sv[k] = v; });
  const last = Object.values(sv).sort((a,b) => b.t - a.t)[0];
  if (last) { const pct = Math.round(last.solved / Math.max(1,last.total) * 100);
    return {k:"CONTINUAR", ic:last.icon||"🎮", n:last.title, sub:`Parte ${last.stage+1} de ${last.stages} · ${pct} % – mach weiter, wo du aufgehört hast`, href:last.url, pct:pct}; }
  const m = monster();
  if (m.n >= 8) return {k:"¡TU MONSTRUO CRECE!", ic:"👾", n:"El Monstruo de los Errores", sub:`${m.n} palabras en tu caja – ¡hazlo pequeño! · Deine Fehler-Kiste ist voll`, href:"boss.html?id=review"};
  const order = [];
  [...new Set(GRAMMAR.map(g => g.unit))].sort().forEach(u => { GRAMMAR.filter(g => g.unit === u).forEach(g => order.push(ALL.find(x => x.id === g.id))); const b = ALL.find(x => x.id === "jefe-"+u); if (b) order.push(b); });
  const nx = order.find(g => g && !starsOf(g.id));
  if (nx) return {k:"SIGUIENTE MISIÓN", ic:(GRAMMAR.find(g=>g.id===nx.id)||{}).icon||"⚔️", n:nx.name, sub:"Noch nicht gespielt – los geht's!", href:nx.href};
  if (s.stats && !s.stats.dailyToday) return {k:"RETO DEL DÍA", ic:"📅", n:"Jefe del día", sub:"Heute noch nicht gespielt", href:"boss.html?id=daily"};
  if (m.n) return {k:"CAJA DE ERRORES", ic:"👾", n:"El Monstruo de los Errores", sub:`${m.n} palabras – ¡a por ellas!`, href:"boss.html?id=review"};
  const low = order.filter(g => g && starsOf(g.id) < 3).sort((a,b) => starsOf(a.id) - starsOf(b.id))[0];

  if (!state()) { closeShop(); window.scrollTo({top:0,behavior:"smooth"}); if($("msg")) $("msg").textContent="Primero inicia sesión. – Bitte zuerst anmelden."; return; }
  if (n === "home") { location.href = "home.html"; return; }
  if (n === "trophies") return openTrophies();
  tab = 0; openShop(n);
});
function setNav(n){ document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.n === n)); }

/* ===== Trophäen ===== */
function openTrophies(){
  const s = state(); setNav("trophies"); $("ov").classList.add("show");
  $("shop").innerHTML = `<div class="row" style="justify-content:space-between"><div class="D" style="font-size:30px">TROFEOS</div><button class="btn small" onclick="closeShop()">✕ Cerrar</button></div>
    <h3 class="sec">Insignias</h3><div class="ach">${ACH.map(a=>`<div class="${s.stats&&a[3](s)?"":"off"}"><b>${a[0]}</b><span><strong>${a[1]}</strong><br><span class="de" style="font-style:normal">${a[2]}</span></span></div>`).join("")}</div>
    <h3 class="sec">Top 3</h3>${ALL.filter(g=>g.id!=="daily"&&g.id!=="review").map(g=>{const l=SCORES[g.id]||[];return `<div class="trow"><span class="nm">${g.name}</span>${l.length?l.map((x,i)=>`<span class="top3" style="margin:0"><span class="p ${["g","s","b"][i]}"><div>${E8.avatarSVG(x.eq)}</div>#${x.nr}</span></span>`).join(""):`<span class="de">Nadie todavía – ¡sé el primero o la primera!</span>`}</div>`}).join("")}`;
}

/* ===== Locker & Shop ===== */
let tab=0, trying=null, busy=false, MODE="shop";
const MON=["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function seasonText(it){ if(!it.months) return ""; const m=it.months; return (m.length===1?MON[m[0]]:MON[m[0]]+"–"+MON[m[m.length-1]])+" solo"; }
function openShop(mode){ const s=state(); if(!s) return; MODE=mode||"shop"; setNav(MODE); trying=E8.clean(s.equipped); $("ov").classList.add("show"); drawShop(); }
function closeShop(){ $("ov").classList.remove("show"); setNav("play"); render(); if(SEL) select(SEL); }
function isMine(id){ const it=E8.item(id), s=state(); return it.price===0 || s.owned.indexOf(id)>=0; }
function drawShop(msg, ok){
  const s=state(); if(!s){ closeShop(); return; }
  const worn=E8.clean(s.equipped), lv=s.level||1;
  const notMine=E8.SLOTS.filter(k=>!isMine(trying[k]));
  const changed=JSON.stringify(trying)!==JSON.stringify(worn);
  let action="";
  if(notMine.length===1){
    const it=E8.item(trying[notMine[0]]), can=E8.inSeason(it), lvOk=(!it.lvl||lv>=it.lvl)&&(!it.adv||(s.adv||0)>=it.adv);
    action=`<button class="btn primary" id="buy" ${(!can||!lvOk||s.coins<it.price)?"disabled":""}>Comprar “${it.name}” por ${it.price} 🪙</button>`;
    if(!can) msg=msg||"Ahora no está disponible. – Gerade nicht erhältlich.";
    else if(!lvOk) msg=msg||(it.adv?`🎄 Abre ${it.adv} puertas del calendario de Adviento (tienes ${s.adv||0}). – Öffne ${it.adv} Türchen im Adventskalender.`:`🔒 Necesitas el nivel ${it.lvl}. – Dafür brauchst du Level ${it.lvl}.`);
    else if(s.coins<it.price) msg=msg||`Te faltan ${it.price-s.coins} monedas. – Dir fehlen noch ${it.price-s.coins} Münzen.`;
  } else if(notMine.length>1){ msg=msg||"Te estás probando varias cosas que no tienes. Cómpralas una a una. – Mehrere Teile sind noch nicht gekauft."; }
  else if(changed) action=`<button class="btn primary" id="wear">✔ Guardar mi look</button>`;
  if(changed) action+=` <button class="btn small" id="reset">Deshacer</button>`;
  if(notMine.length===1 && "wish" in s && MODE==="shop"){ const wid=trying[notMine[0]]; action+=` <button class="btn small" id="goal">${s.wish===wid?"🎯 Es tu objetivo ✔ (quitar)":"🎯 Mi objetivo"}</button>`; }
  const topIt=E8.item(trying.top), isClub=topIt&&topIt.kind==="club";
  const dorsal=isClub?`<div class="dorsal"><b>⚽ Dorsal – Rückennummer:</b><input id="num" type="number" inputmode="numeric" min="0" max="99" value="${trying.num===undefined?10:trying.num}"><span class="de">0–99</span></div>`:"";
  const slots=E8.TABS[tab][1];
  const sections=slots.map(slot=>{
    const items=E8.CATALOG.filter(i=>i.slot===slot && (MODE==="locker" ? isMine(i.id) : ((E8.inSeason(i)&&E8.available(i))||isMine(i.id))));
    return (slots.length>1?`<h3 class="sec">${E8.SLOTNAME[slot]}</h3>`:"")+`<div class="items">`+items.map(i=>{
      const t=Object.assign({},trying,{[slot]:i.id}), r=E8.rarity(i.price), mine=isMine(i.id), locked=((i.lvl&&lv<i.lvl)||(i.adv&&(s.adv||0)<i.adv))&&!mine;
      return `<div class="item ${trying[slot]===i.id?"sel":""} ${worn[slot]===i.id?"wear":""}" data-slot="${slot}" data-id="${i.id}" style="border-top:4px solid ${r.color}">
        ${s.wish===i.id&&!mine?`<span class="goalmark" title="Mi objetivo">🎯</span>`:""}${locked?`<span class="lock">${i.adv?"🎄 "+(s.adv||0)+"/"+i.adv:"🔒 Nivel "+i.lvl}</span>`:""}
        <div class="mini">${E8.avatarSVG(t)}</div><div class="iname">${i.name}</div>
        <div class="rar" style="color:${r.color}">${i.price?r.name:"&nbsp;"}${i.unit?" · Unidad "+i.unit:""}${i.months?" · "+seasonText(i):""}</div>
        <div class="price ${mine?"own":""}">${i.price===0?"gratis":mine?"✔ tuyo":i.price+" 🪙"}</div></div>`;
    }).join("")+`</div>`;
  }).join("");
  $("shop").innerHTML = `
    <div class="shoptop">
      <div class="preview">${E8.avatarSVG(trying)}</div>
      <div style="flex:1;min-width:220px">
        <div class="row" style="justify-content:space-between"><div><span class="D" style="font-size:30px">${MODE==="locker"?"TAQUILLA":"TIENDA"}</span> &nbsp;<span class="coins D">🪙 ${s.coins}</span> <span class="lvl">Nivel ${lv}</span></div><button class="btn small" id="close">✕ Cerrar</button></div>
        <p style="margin:8px 0">${MODE==="locker"?"Tus cosas – toca para ponértelas. – Deine Sachen, tippe zum Anziehen.":"Toca algo para probártelo. – Tippe auf ein Teil, um es anzuprobieren."}</p>
        <div class="row">${action}</div>${dorsal}
        <div class="msg ${ok?"ok":""}" id="smsg">${msg||""}</div>
      </div>
    </div>
    <div class="tabs">${E8.TABS.map(([n],i)=>`<button class="tab ${i===tab?"on":""}" data-i="${i}">${n}</button>`).join("")}</div>
    ${sections}`;
  $("close").onclick=closeShop;
  if($("reset")) $("reset").onclick=()=>{trying=E8.clean(s.equipped);drawShop();};
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=+b.dataset.i;drawShop();});
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{trying[b.dataset.slot]=b.dataset.id;drawShop();});
  if($("num")) $("num").onchange=()=>{ let n=Math.floor(+$("num").value); if(!(n>=0&&n<=99)) n=10; trying.num=n; drawShop(); };
  if($("goal")) $("goal").onclick=async()=>{
    if(busy) return; busy=true; const wid=trying[notMine[0]];
    const r=await E8.call("prefs",{wish: s.wish===wid?"":wid}); busy=false;
    if(!r.ok){ if(!state()) return closeShop(); return drawShop(E8.errText(r.error)); }
    drawShop(state().wish?"🎯 ¡Objetivo guardado! En la página principal ves cuánto te falta. – Ziel gespeichert.":"Objetivo quitado. – Ziel entfernt.", true);
  };
  if($("buy")) $("buy").onclick=async()=>{
    if(busy) return; busy=true; $("buy").disabled=true; $("smsg").className="msg ok"; $("smsg").textContent="…";
    const bought=trying[notMine[0]];
    const r=await E8.call("buy",{item:bought}); busy=false;
    if(!r.ok){ if(!state()) return closeShop(); return drawShop(E8.errText(r.error)); }
    if(state().wish===bought){ await E8.call("prefs",{wish:""}); E8.confetti(60); }
    const r2=await E8.call("equip",{equipped:trying});
    drawShop(r2.ok?"🎉 ¡Comprado y guardado!":E8.errText(r2.error), r2.ok);
  };
  if($("wear")) $("wear").onclick=async()=>{
    if(busy) return; busy=true; $("wear").disabled=true;
    const r=await E8.call("equip",{equipped:trying}); busy=false;
    if(!r.ok && !state()) return closeShop();
    drawShop(r.ok?"✔ ¡Guardado!":E8.errText(r.error), r.ok);
  };
}



/* ===== Eigene PIN ===== */
function afterLogin(){
  const s = state();
  if (s && s.fresh){ tab=0; openShop("shop"); drawShop("👋 ¡Bienvenido/a! Primero crea tu avatar – aquí todo es gratis. – Gestalte zuerst deinen Avatar, alles hier ist kostenlos.",true); }
}
function pinDialog(first){
  $("pinbox").innerHTML = `<div style="font-size:46px">🔑</div><h2 class="D" style="margin:4px 0">${first?"ELIGE TU PROPIO PIN":"CAMBIA TU PIN"}</h2>
    <p>${first?"El PIN de tu profe era solo para el primer login. Ahora elige tu propio PIN de 4 cifras.":"Elige un PIN nuevo de 4 cifras."}</p>
    <div class="de">${first?"Die PIN von deiner Lehrkraft war nur für das erste Mal. Wähle jetzt deine eigene PIN, die du dir merken kannst. ":""}Nicht 1234, nicht 1111, nicht deine Nummer.</div>
    <label>PIN NUEVO</label><input id="np1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    <label>OTRA VEZ – noch einmal</label><input id="np2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    <div class="msg" id="pmsg" style="min-height:22px;margin:8px 0"></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="psave">GUARDAR ✔</button>${first?"":`<button class="btn" id="pcancel">Cancelar</button>`}</div>`;
  $("pinov").classList.add("show"); setTimeout(()=>$("np1").focus(),50);
  if ($("pcancel")) $("pcancel").onclick = () => $("pinov").classList.remove("show");
  $("np2").addEventListener("keydown",e=>{ if(e.key==="Enter") $("psave").click(); });
  $("psave").onclick = async () => {
    const a=$("np1").value.trim(), b=$("np2").value.trim(), m=$("pmsg");
    m.className="msg";
    if(!/^\d{4}$/.test(a)){ m.textContent="4 cifras, por favor. – Bitte 4 Ziffern."; return; }
    if(a!==b){ m.textContent=E8.errText("pinmatch"); return; }
    $("psave").disabled=true; m.className="msg ok"; m.textContent="Guardando …";
    const r = await E8.setPin(a); $("psave").disabled=false;
    if(!r.ok){ m.className="msg"; m.textContent=E8.errText(r.error); return; }
    $("pinbox").innerHTML = `<div style="font-size:46px">✅</div><h2 class="D">¡PIN GUARDADO!</h2><p>¡No lo olvides! La próxima vez entra con tu número y tu PIN nuevo.</p><div class="de">Merk sie dir gut! Ab jetzt meldest du dich mit deiner neuen PIN an.</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="pok">OK ▶</button></div>`;
    $("pok").onclick = () => { $("pinov").classList.remove("show"); render(); if(first) afterLogin(); };
  };
}

/* ===== Tutorial ===== */
const TOUR = [
  {sel:null, t:"¡BIENVENIDOS A LOS JUEGOS DEL CIERVO!", p:"Aquí practicas español con juegos, ganas monedas, subes de nivel y vistes a tu avatar. ¡Vamos a ver cómo funciona!", de:"Hier übst du Spanisch mit Spielen, sammelst Münzen und gestaltest deinen Avatar. Kurze Tour!"},
  {sel:"#hero", t:"TÚ", p:"Este es tu avatar. Inicia sesión con tu <b>número</b> y el <b>PIN de 4 cifras</b> de tu profe. La primera vez eliges tu <b>propio PIN</b>. Sin login puedes jugar, pero no ganas monedas.", de:"Beim ersten Login wählst du deine eigene PIN. Ohne Login kannst du spielen, bekommst aber keine Münzen."},
  {sel:".lobby .feat", t:"TU JUEGO", p:"Aquí ves el juego elegido. Pulsa <b>JUGAR</b> para empezar. Solo sigues cuando la respuesta es correcta – los errores vuelven más tarde.", de:"Mit JUGAR startest du. Du kommst nur weiter, wenn alles richtig ist."},
  {sel:"#shelves .shelf:nth-child(2)", t:"TODOS LOS JUEGOS", p:"Los juegos están ordenados por unidad: jefes de vocabulario y misiones. Toca un juego <b>una vez</b> para verlo y <b>otra vez</b> para jugar.", de:"Einmal tippen = ansehen, nochmal tippen = spielen. Wische die Reihen zur Seite."},
  {sel:".strip .card[data-id='daily']", t:"RETO DEL DÍA", p:"Cada día hay un jefe nuevo con 10 palabras de todas las unidades. ¡Juega cada día y gana monedas extra!", de:"Jeden Tag neu – Münzen gibt es einmal am Tag."},
  {sel:"#top", t:"MONEDAS Y NIVEL", p:"La primera vez: 20–40 monedas (más estrellas = más monedas). Juega otra vez y consigue más estrellas para ganar más. Cada moneda te da también XP para tu <b>nivel</b>.", de:"Mehr Sterne = mehr Münzen. Mit Münzen steigst du auch im Level auf – Level schalten besondere Shop-Teile frei."},
  {sel:".nav", t:"TAQUILLA, TIENDA Y TROFEOS", p:"<b>Tienda</b>: compra ropa, sombreros, mascotas y efectos locos. <b>Taquilla</b>: cambia tu look. <b>Trofeos</b>: tus insignias y el top 3 de cada juego.", de:"In der Tienda kaufst du, in der Taquilla ziehst du dich um, bei Trofeos siehst du Abzeichen und Bestenlisten."},
  {sel:".nav button[data-n='home']", t:"MI CASA", p:"¡Construye tu propia casa! Tus <b>estrellas</b> la hacen más grande: tienda de campaña → cabaña → casa → villa → mansión. Con <b>monedas</b> eliges paredes, tejado, ventanas y jardín. También puedes visitar las casas de tus compañeros en <b>la ciudad</b>.", de:"Sterne lassen dein Haus wachsen, mit Münzen gestaltest du es. Du kannst auch die Häuser der anderen besuchen."},
  {sel:".strip .card[data-id='review']", t:"CAJA DE ERRORES", p:"Después de un jefe de vocabulario, las palabras que tenías mal van a tu <b>caja de errores</b>. ¡Derrota al Monstruo de los Errores y las palabras desaparecen!", de:"Wörter, die du falsch hattest, landen in deiner Fehler-Kiste. Wenn du sie richtig hast, verschwinden sie wieder."},
  {sel:null, t:"¡UNA COSA MÁS!", p:"En un iPad del cole, pulsa siempre <b>Salir</b> al terminar. ¡Y ahora – a jugar! 🎮", de:"Auf Schul-iPads am Ende immer abmelden! Viel Spaß!"}
];
let TI = 0;
function tour(){ TI = 0; $("tour").classList.add("show"); window.scrollTo(0,0); tourStep(); }
function tourEnd(){ $("tour").classList.remove("show"); }
function tourStep(){
  const s = TOUR[TI], el = s.sel && document.querySelector(s.sel), hole = $("hole"), tip = $("tip");
  if (s.sel && !el && s.sel.indexOf("review") >= 0) { s.sel = null; }
  if (el) { el.scrollIntoView({block:"center", behavior:"instant"}); }
  setTimeout(() => {
    const vw = innerWidth, vh = innerHeight;
    if (el) { const r = el.getBoundingClientRect(), p = 8; Object.assign(hole.style,{left:(r.left-p)+"px",top:(r.top-p)+"px",width:(r.width+2*p)+"px",height:Math.min(r.height+2*p,vh-20)+"px"}); }
    else Object.assign(hole.style,{left:(vw/2)+"px",top:(vh/2)+"px",width:"0px",height:"0px"});
    tip.innerHTML = `<div class="steps">${TI+1} / ${TOUR.length}</div><h4 class="D">${s.t}</h4><p>${s.p}</p><span class="de">${s.de}</span>
      <div class="row"><button class="btn primary" id="tn">${TI===TOUR.length-1?"¡Vamos! ▶":"Siguiente ▶"}</button>${TI>0?`<button class="btn" id="tb">◀ Atrás</button>`:""}<button class="btn small" id="ts" style="margin-left:auto">Saltar</button></div>`;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let L, T;
    if (el) { const r = el.getBoundingClientRect();
      L = Math.min(Math.max(12, r.left), vw - tw - 12);
      if (r.bottom + 16 + th < vh) { T = r.bottom + 16; }
      else if (r.top - 16 - th > 0) { T = r.top - 16 - th; }
      else if (r.right + 16 + tw < vw) { L = r.right + 16; T = Math.max(12, Math.min(r.top, vh - th - 12)); }
      else if (r.left - 16 - tw > 0) { L = r.left - 16 - tw; T = Math.max(12, Math.min(r.top, vh - th - 12)); }
      else { T = vh - th - 80; }
    } else { L = (vw - tw) / 2; T = (vh - th) / 2; }
    Object.assign(tip.style,{left:L+"px",top:Math.max(12,T)+"px"});
    $("tn").onclick = () => { if (TI < TOUR.length-1) { TI++; tourStep(); } else tourEnd(); };
    if ($("tb")) $("tb").onclick = () => { TI--; tourStep(); };
    $("ts").onclick = tourEnd;
  }, el ? 60 : 0);
}

/* ===== Start ===== */
(function(){
  let pre = null; try{ pre = sessionStorage.getItem("efspa0sel"); }catch(e){}
  const START = "adjetivos"; /* Spiel, das beim Öffnen zuerst ausgewählt ist */
  SEL = ALL.find(g => g.id === pre) || ALL.find(g => g.id === START) || ALL.find(g => g.isNew) || ALL[0];
  render(); setBg(SEL);
  if (E8.online()) E8.api("scores",{}).then(r => { if (r.ok) { SCORES = r.scores; feat(); if (state()) hero(); } });
  if (state()) E8.call("login").then(() => { topBar(); hero(); feat(); mineBox(); VIEW==="map" ? mapView() : shelves(); const s = state(); if (s && s.mustSetPin) pinDialog(true); });
  if (location.hash === "#tour") setTimeout(tour, 600);
})();
